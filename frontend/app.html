<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cut OUT Pro AI - Background Removal Tool</title>

<style>
body{
font-family:Arial,sans-serif;
text-align:center;
padding:30px;
background:#f5f7fa;
margin:0;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    padding: 40px;
}

h1 {
    color: #2563eb;
    margin-bottom: 30px;
}

.upload-section {
    margin-bottom: 30px;
}

.file-input-wrapper {
    position: relative;
    margin-bottom: 20px;
}

.file-input {
    display: none;
}

.file-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    border: 2px dashed #2563eb;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
    background: #f0f4ff;
}

.file-label:hover {
    border-color: #7c3aed;
    background: #ede9fe;
}

.file-label.dragover {
    border-color: #7c3aed;
    background: #ede9fe;
}

.upload-icon {
    font-size: 3em;
    margin-bottom: 10px;
}

.file-label p {
    font-size: 1.1em;
    color: #333;
    margin-bottom: 5px;
    font-weight: 500;
}

.file-hint {
    font-size: 0.9em;
    color: #999;
}

.image-preview-section {
    text-align: center;
    margin-top: 20px;
    padding: 20px;
    background: #f8f9fa;
    border-radius: 10px;
}

.image-preview-section h3 {
    margin-bottom: 15px;
    color: #333;
}

.image-preview-section img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}

.button-section {
    text-align: center;
    margin-bottom: 30px;
}

button{
    padding: 12px 20px;
    cursor: pointer;
    margin-top: 15px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 16px;
    transition: all 0.3s ease;
}

button:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

img{
    max-width:300px;
    margin-top:20px;
}

.result-section {
    text-align: center;
    margin-top: 30px;
    padding: 30px;
    background: #f8f9fa;
    border-radius: 10px;
}

.result-section h3 {
    color: #2563eb;
    margin-bottom: 20px;
    font-size: 1.3em;
}

.result-section img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 8px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
}

.download-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

.download-buttons a,
.download-buttons button {
    padding: 10px 20px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    text-decoration: none;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}

.download-buttons a:hover,
.download-buttons button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4);
}

.error {
    color: #d32f2f;
    padding: 15px;
    background: #ffebee;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #d32f2f;
}

.success {
    color: #388e3c;
    padding: 15px;
    background: #e8f5e9;
    border-radius: 8px;
    margin-bottom: 20px;
    border-left: 4px solid #388e3c;
}

.loading {
    text-align: center;
    padding: 30px;
}

.spinner {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading p {
    color: #2563eb;
    font-weight: 500;
    margin-top: 10px;
}

.hidden {
    display: none !important;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    h1 {
        font-size: 1.5em;
    }

    button {
        padding: 10px 15px;
        font-size: 14px;
    }

    .file-label {
        padding: 20px 10px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>✂️ Cut OUT Pro AI</h1>
    
    <div class="upload-section">
        <div class="file-input-wrapper">
            <label for="imageInput" class="file-label">
                <div class="upload-icon">📤</div>
                <p>Click to select an image or drag & drop</p>
                <span class="file-hint">PNG, JPG, GIF, WebP (Max 10MB)</span>
            </label>
            <input type="file" id="imageInput" accept="image/*" class="file-input">
        </div>

        <div id="imagePreview" class="image-preview-section hidden">
            <h3>Original Image</h3>
            <img id="previewImage" src="" alt="Preview">
        </div>
    </div>

    <div class="button-section">
        <button id="removeBgBtn" onclick="removeBg()" disabled>
            🎯 Remove Background
        </button>
    </div>

    <div id="result"></div>

    <div id="loadingSpinner" class="loading hidden">
        <div class="spinner"></div>
        <p>Processing your image...</p>
    </div>
</div>

<script>
// Configuration
const API_BASE_URL = 'http://localhost:5000';
const ALLOWED_EXTENSIONS = ['png', 'jpg', 'jpeg', 'gif', 'webp'];
const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB

// DOM Elements
const imageInput = document.getElementById('imageInput');
const removeBgBtn = document.getElementById('removeBgBtn');
const resultDiv = document.getElementById('result');
const loadingSpinner = document.getElementById('loadingSpinner');
const fileLabel = document.querySelector('.file-label');
const imagePreview = document.getElementById('imagePreview');
const previewImage = document.getElementById('previewImage');

// Event Listeners
imageInput.addEventListener('change', handleFileSelect);
fileLabel.addEventListener('dragover', handleDragOver);
fileLabel.addEventListener('dragleave', handleDragLeave);
fileLabel.addEventListener('drop', handleDrop);

/**
 * Handle file selection
 */
function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file) {
        validateAndPreviewFile(file);
    }
}

/**
 * Handle drag over
 */
function handleDragOver(event) {
    event.preventDefault();
    event.stopPropagation();
    fileLabel.classList.add('dragover');
}

/**
 * Handle drag leave
 */
function handleDragLeave(event) {
    event.preventDefault();
    event.stopPropagation();
    fileLabel.classList.remove('dragover');
}

/**
 * Handle file drop
 */
function handleDrop(event) {
    event.preventDefault();
    event.stopPropagation();
    fileLabel.classList.remove('dragover');
    
    const files = event.dataTransfer.files;
    if (files.length > 0) {
        imageInput.files = files;
        validateAndPreviewFile(files[0]);
    }
}

/**
 * Validate and preview file
 */
function validateAndPreviewFile(file) {
    // Reset previous results
    resultDiv.innerHTML = '';
    
    // Validate file size
    if (file.size > MAX_FILE_SIZE) {
        showError(`File too large! Maximum size is 10MB (Your file: ${(file.size / 1024 / 1024).toFixed(2)}MB)`);
        imageInput.value = '';
        removeBgBtn.disabled = true;
        imagePreview.classList.add('hidden');
        return;
    }
    
    // Validate file type
    const fileExtension = file.name.split('.').pop().toLowerCase();
    if (!ALLOWED_EXTENSIONS.includes(fileExtension)) {
        showError(`Invalid file type! Allowed types: ${ALLOWED_EXTENSIONS.join(', ')}`);
        imageInput.value = '';
        removeBgBtn.disabled = true;
        imagePreview.classList.add('hidden');
        return;
    }
    
    // Show preview
    const reader = new FileReader();
    reader.onload = (e) => {
        previewImage.src = e.target.result;
        imagePreview.classList.remove('hidden');
        removeBgBtn.disabled = false;
    };
    reader.readAsDataURL(file);
}

/**
 * Remove background from image
 */
async function removeBg() {
    const file = imageInput.files[0];
    
    if (!file) {
        showError('Please select an image first');
        return;
    }
    
    // Show loading spinner
    loadingSpinner.classList.remove('hidden');
    resultDiv.innerHTML = '';
    removeBgBtn.disabled = true;
    
    try {
        console.log('Starting background removal for:', file.name);
        
        // Prepare form data
        const formData = new FormData();
        formData.append('image_file', file);
        
        // Send request to backend
        console.log('Sending request to:', `${API_BASE_URL}/api/remove-background`);
        const response = await fetch(`${API_BASE_URL}/api/remove-background`, {
            method: 'POST',
            body: formData
        });
        
        console.log('Response status:', response.status);
        
        // Hide loading spinner
        loadingSpinner.classList.add('hidden');
        
        if (response.ok) {
            console.log('✅ Successfully received image from backend');
            // Get blob from response
            const blob = await response.blob();
            console.log('Blob size:', blob.size, 'Type:', blob.type);
            const url = URL.createObjectURL(blob);
            
            // Display result
            displayResult(url);
        } else {
            // Handle error response
            console.error('API returned error status:', response.status);
            try {
                const errorData = await response.json();
                console.error('Error details:', errorData);
                showError(errorData.error || 'Failed to remove background. Please try again.');
            } catch {
                showError(`Server error (${response.status}). Check backend console for details.`);
            }
        }
    } catch (error) {
        loadingSpinner.classList.add('hidden');
        console.error('Fetch error:', error);
        showError(`Error: ${error.message}\n\nMake sure:\n1. Backend server is running on http://localhost:5000\n2. Your remove.bg API key is valid\n3. You have internet connection`);
    } finally {
        removeBgBtn.disabled = false;
    }
}

/**
 * Display result with download options
 */
function displayResult(imageUrl) {
    resultDiv.innerHTML = `
        <div class="result-section">
            <h3>✨ Background Removed Successfully!</h3>
            <img src="${imageUrl}" alt="Result">
            <div class="download-buttons">
                <a href="${imageUrl}" download="cutout.png">⬇️ Download PNG</a>
                <button onclick="copyImageUrl('${imageUrl}')">📋 Copy Image</button>
                <button onclick="resetForm()">🔄 Process Another</button>
            </div>
        </div>
    `;
}

/**
 * Copy image to clipboard
 */
async function copyImageUrl(imageUrl) {
    try {
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        await navigator.clipboard.write([
            new ClipboardItem({ [blob.type]: blob })
        ]);
        showSuccess('Image copied to clipboard!');
    } catch (error) {
        console.error('Clipboard error:', error);
        showError('Failed to copy image to clipboard');
    }
}

/**
 * Reset form
 */
function resetForm() {
    imageInput.value = '';
    resultDiv.innerHTML = '';
    imagePreview.classList.add('hidden');
    removeBgBtn.disabled = true;
}

/**
 * Show error message
 */
function showError(message) {
    resultDiv.innerHTML = `<div class="error" style="white-space: pre-wrap;">❌ ${message}</div>`;
}

/**
 * Show success message
 */
function showSuccess(message) {
    // Create temporary success message
    const tempDiv = document.createElement('div');
    tempDiv.className = 'success';
    tempDiv.innerHTML = `✅ ${message}`;
    resultDiv.appendChild(tempDiv);
    
    setTimeout(() => {
        tempDiv.remove();
    }, 3000);
}

/**
 * Check backend connectivity on page load
 */
window.addEventListener('load', async () => {
    try {
        console.log('Checking backend connectivity...');
        const response = await fetch(`${API_BASE_URL}/api/health`);
        if (response.ok) {
            const data = await response.json();
            console.log('✅ Backend is connected', data);
            if (!data.api_key_configured) {
                showError('⚠️ WARNING: API key not configured! Set REMOVE_BG_API_KEY in backend/.env');
            }
        }
    } catch (error) {
        console.error('❌ Backend connection failed:', error);
        showError('⚠️ Backend server is not running on http://localhost:5000. Please start it with: cd backend && python app.py');
    }
});
</script>

</body>
</html>
